# Official publisher/renewal configuration. Source builds keep updater.toml defaults.
# No private signing material or Cloudflare credentials belong in this file.
schema_version = 1
source = "service"
repository = "CryptoKey98/craft-apps-manager"
channel = "stable"
public_key_file = "assets/update-public-key.hex"

[service]
catalog_url = "https://craft-apps-manager-updates.cryptokeyofficial.workers.dev/v2/catalog.json"
mirror_url = "https://github.com/CryptoKey98/craft-apps-manager/releases/download/v0.9.0/updates-v2.json"
check_url = ""

[publishing]
enabled = true
profiles_file = "update-service/catalog/supported-clients.json"
next_catalog_file = "update-service/catalog/standby.json"
mirror_tag = "v0.9.0"
catalog_validity_days = 30
renew_before_days = 7

[worker]
name = "craft-apps-manager-updates"
dynamic_enabled = false
rate_limit_requests = 120
rate_limit_period_seconds = 60
rate_limit_namespace = "168300900"
