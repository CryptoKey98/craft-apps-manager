[package]
name = "craft-apps-manager"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Release and source manager for the Craft apps"
repository = "https://github.com/CryptoKey98/craft-apps-manager"
readme = "README.md"
default-run = "craft-apps-manager"

[features]
release-tools = ["dep:toml_edit", "dep:semver"]

[[bin]]
name = "release-tool"
path = "src/bin/release-tool.rs"
required-features = ["release-tools"]

[dependencies]
toml_edit = { version = "0.25", optional = true }
semver = { version = "1", optional = true }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit", "__screenshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_System_TaskScheduler", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_Registry"] }
winreg = "0.55"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
