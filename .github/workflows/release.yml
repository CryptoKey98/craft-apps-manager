name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to update
        required: true
        default: v0.8.3
      revision:
        description: Build revision (1 rebuilds a draft baseline)
        required: true
        default: '2'
      platform:
        description: Platform receiving the hotfix
        type: choice
        options: [all, windows, linux, macos]
        required: true
      publish_baseline:
        description: Publish the baseline after rebuilding (leave off to keep it draft)
        type: boolean
        default: false
      source_ref:
        description: Commit SHA containing the hotfix
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  CRAFT_BUILD_REVISION: ${{ inputs.revision || '1' }}
  CRAFT_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Packages self-update from the releases of the repository that built them.
  CRAFT_MANAGER_REPOSITORY: ${{ github.repository }}
jobs:
  validate:
    name: Validate release version and notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Validate tag, version references and release notes
        run: python3 scripts/validate-release.py --tag "$CRAFT_RELEASE_TAG" --notes-file notes.md
      - name: Validate revision publishing inputs
        env:
          CRAFT_UPDATE_SIGNING_KEY: ${{ secrets.CRAFT_UPDATE_SIGNING_KEY }}
          REVISION_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          test -n "$CRAFT_UPDATE_SIGNING_KEY" || { echo "Configure CRAFT_UPDATE_SIGNING_KEY before publishing" >&2; exit 1; }
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            case "$REVISION_SOURCE_REF" in *[!0-9a-f]*|'') echo "Use an immutable commit SHA" >&2; exit 1;; esac
            test "${#REVISION_SOURCE_REF}" -eq 40
            if [ "$CRAFT_BUILD_REVISION" = 1 ]; then
              test "${{ inputs.platform }}" = all || { echo "Baseline rebuilds must include all platforms" >&2; exit 1; }
            fi
          fi
          if [ "$CRAFT_BUILD_REVISION" != 1 ]; then
            case "$CRAFT_BUILD_REVISION" in *[!0-9]*|'') exit 1;; esac
            test "$CRAFT_BUILD_REVISION" -ge 2 && test "$CRAFT_BUILD_REVISION" -le 65535
            case "$REVISION_SOURCE_REF" in *[!0-9a-f]*|'') echo "Use an immutable commit SHA" >&2; exit 1;; esac
            test "${#REVISION_SOURCE_REF}" -eq 40
            test "${#CRAFT_RELEASE_TAG}" -gt 1
          fi
      - name: Reject an already-published release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          if printf '%s' "$releases" | jq -e --arg tag "$CRAFT_RELEASE_TAG" 'any(.[]; .tag_name == $tag and .draft == false)' >/dev/null; then
            echo "This tag already has a published release. Use a new version instead." >&2
            exit 1
          fi
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    needs: validate
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            seven: 7zip/x64
          - arch: x86
            target: i686-pc-windows-msvc
            seven: 7zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Download the 7-Zip console tools bundled with the manager
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo ip7z/7zip --pattern '*-extra.7z' --dir 7zip-download
          & 'C:\Program Files\7-Zip\7z.exe' x (Get-ChildItem 7zip-download/*-extra.7z).FullName -o7zip -y
          if ($LASTEXITCODE -ne 0) { throw '7-Zip extraction failed' }
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Package
        shell: pwsh
        run: |
          $out = "dist/windows-${{ matrix.arch }}"
          ./scripts/package-windows.ps1 -Architecture ${{ matrix.arch }} -SevenZipFolder ${{ matrix.seven }} -TargetFolder target -OutputFolder $out
          ./scripts/package-windows-msi.ps1 -Architecture ${{ matrix.arch }} -SevenZipFolder ${{ matrix.seven }} -TargetFolder target -OutputFolder $out
          Get-ChildItem $out -File
      - name: Verify upgrade from the previous MSI release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:CRAFT_BUILD_REVISION -eq '1') {
            gh release download v0.5.1 --repo CryptoKey98/craft-apps-manager --pattern 'Craft-Apps-Manager-0.5.1-windows-${{ matrix.arch }}.msi' --dir baseline
          } else {
            gh release download $env:CRAFT_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern updates-v1.json --dir baseline-metadata
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the current revision manifest' }
            $envelope = Get-Content baseline-metadata/updates-v1.json -Raw | ConvertFrom-Json
            $manifest = $envelope.payload | ConvertFrom-Json
            $previous = @($manifest.packages | Where-Object { $_.platform -eq 'windows' -and $_.architecture -eq '${{ matrix.arch }}' -and $_.format -eq 'msi' })
            if ($previous.Count -ne 1) { throw 'Expected one previous MSI revision for this architecture' }
            gh release download $env:CRAFT_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $previous[0].asset --dir baseline
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the baseline MSI' }
          $baseline = (Get-ChildItem baseline/*.msi).FullName
          $candidate = (Get-ChildItem 'dist/windows-${{ matrix.arch }}/*.msi').FullName
          ./scripts/smoke-windows-msi.ps1 -Architecture ${{ matrix.arch }} -BaselineMsi $baseline -CandidateMsi $candidate
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/windows-${{ matrix.arch }}/*.zip
            dist/windows-${{ matrix.arch }}/*.msi
          if-no-files-found: error
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    needs: validate
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            pkgconfig: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          - target: i686-unknown-linux-gnu
            pkgconfig: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_LIBDIR: ${{ matrix.pkgconfig }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libssl-dev dpkg-dev rpm zip
      - if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386 libx11-dev:i386 libxi-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 libxkbcommon-dev:i386 libwayland-dev:i386 libgl1-mesa-dev:i386 libegl1-mesa-dev:i386
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package ZIP, DEB and RPM
        run: |
          binary=target/${{ matrix.target }}/release/craft-apps-manager
          sh scripts/package-linux-zip.sh "$binary"
          sh scripts/package-linux-deb.sh "$binary"
          sh scripts/package-linux-rpm.sh "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            dist/linux/*.zip
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error
  arch:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    needs: validate
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --needed --noconfirm git rust python pkgconf openssl libx11 libxi libxrandr libxcursor libxkbcommon wayland libglvnd libarchive polkit libnotify xdg-utils
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Build and package as a regular user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- sh -c 'cargo build --release --locked && sh scripts/package-linux-arch.sh target/release/craft-apps-manager'
      - uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          path: dist/linux/*.pkg.tar.zst
          if-no-files-found: error
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/macos/*.zip
          if-no-files-found: error
  publish:
    needs: [validate, windows, linux, arch, macos]
    if: ${{ always() && needs.validate.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Prepare signed revision metadata and legacy downloads
        env:
          GH_TOKEN: ${{ github.token }}
          CRAFT_UPDATE_SIGNING_KEY: ${{ secrets.CRAFT_UPDATE_SIGNING_KEY }}
          REVISION_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
          python3 -m pip install 'cryptography==50.0.1'
          previous=()
          if [ "$CRAFT_BUILD_REVISION" != 1 ]; then
            gh release download "$CRAFT_RELEASE_TAG" --pattern updates-v1.json --dir "$RUNNER_TEMP/revision-previous"
            previous=(--previous "$RUNNER_TEMP/revision-previous/updates-v1.json")
          fi
          python3 scripts/revision-manifest.py --packages packages --version "${CRAFT_RELEASE_TAG#v}" --repository "$GITHUB_REPOSITORY" --revision "$CRAFT_BUILD_REVISION" --platform "$REVISION_PLATFORM" "${previous[@]}"
      - name: Checksums
        env:
          REVISION_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          cd packages
          checksum=SHA256SUMS.txt
          python3 - <<'PY' > "$checksum"
          import json
          manifest = json.loads(json.loads(open("updates-v1.json").read())["payload"])
          for package in sorted(manifest["packages"], key=lambda p: p["asset"]):
              print(f"{package['sha256']}  {package['asset']}")
          PY
          cat "$checksum"
      - name: Release notes from the changelog
        run: |
          python3 scripts/validate-release.py --tag "$CRAFT_RELEASE_TAG" --notes-file notes.md
      - name: Publish packages before revision metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_baseline }}
        run: |
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          existing=$(printf '%s' "$releases" | jq -c --arg tag "$CRAFT_RELEASE_TAG" '.[] | select(.tag_name == $tag)')
          manifest="$RUNNER_TEMP/updates-v1.json"
          mv packages/updates-v1.json "$manifest"
          if [ "$CRAFT_BUILD_REVISION" != 1 ]; then
            test -n "$existing" && test "$(printf '%s' "$existing" | jq -r .draft)" = false
            # Replace affected platform downloads, then publish signed metadata.
            for package in packages/*; do
              gh release upload "$CRAFT_RELEASE_TAG" "$package" --clobber
            done
            gh release upload "$CRAFT_RELEASE_TAG" "$manifest" --clobber
          elif [ -n "$existing" ]; then
            test "$(printf '%s' "$existing" | jq -r .draft)" = true || { echo "Refusing to replace a published baseline release" >&2; exit 1; }
            gh release upload "$CRAFT_RELEASE_TAG" packages/* --clobber
            gh release upload "$CRAFT_RELEASE_TAG" "$manifest" --clobber
            gh release edit "$CRAFT_RELEASE_TAG" --title "Craft Apps Manager ${CRAFT_RELEASE_TAG#v}" --notes-file notes.md
            if [ "$PUBLISH_BASELINE" = true ]; then
              gh release edit "$CRAFT_RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$CRAFT_RELEASE_TAG" packages/* "$manifest" --verify-tag --title "Craft Apps Manager ${CRAFT_RELEASE_TAG#v}" --notes-file notes.md --draft
            if [ "${{ github.event_name }}" = push ] || [ "$PUBLISH_BASELINE" = true ]; then
              gh release edit "$CRAFT_RELEASE_TAG" --draft=false
            fi
          fi
