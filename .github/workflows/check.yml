name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: cargo fmt --check
      - run: cargo test --locked --target ${{ matrix.target }} -- --test-threads=1
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}

  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            pkgconfig: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          - target: i686-unknown-linux-gnu
            pkgconfig: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_LIBDIR: ${{ matrix.pkgconfig }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libssl-dev p7zip-full
      - if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386 libx11-dev:i386 libxi-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 libxkbcommon-dev:i386 libwayland-dev:i386 libgl1-mesa-dev:i386 libegl1-mesa-dev:i386
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: cargo fmt --check
      - run: cargo test --locked --target ${{ matrix.target }} --all-targets -- --test-threads=1
        env:
          CRAFT_TEST_TOOLS: /tmp/craft-test-tools
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo fmt --check
      - run: cargo test --locked --all-targets -- --test-threads=1
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/macos/*.zip
          if-no-files-found: error
