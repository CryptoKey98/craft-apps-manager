name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      production_catalog_only:
        description: Test production catalog renewal only; never publish an application release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Raises GitHub's API limit for the release lookups made by tests and end-to-end checks.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.plan.outputs.core }}
      packages: ${{ steps.plan.outputs.packages }}
      metadata: ${{ steps.plan.outputs.metadata }}
      catalog: ${{ steps.plan.outputs.catalog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/testing/test_ci_policy.py
      - id: plan
        run: python3 scripts/testing/ci_policy.py plan

  documentation:
    name: Documentation (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.catalog != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/testing/test_wiki_documentation.py
      - run: python scripts/documentation/wiki.py check --source-commit ${{ github.sha }}

  format:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  updater-v2:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Signed updater routing and Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p craft-updater-config -p craft-updater-service -- --test-threads=1
      - run: python3 scripts/testing/test_updater_config.py
      - run: python3 scripts/testing/test_updater_review.py
      - run: python3 scripts/testing/test_script_entrypoints.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: update-service
      - run: npm test && npm run typecheck && npm run dry-run
        working-directory: update-service
      - run: python3 scripts/testing/test_update_catalog.py
      - run: python3 scripts/testing/test_immutable_assets.py
  release-metadata:
    needs: changes
    if: needs.changes.outputs.metadata == 'true'
    name: Release metadata and validation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/testing/test_validate_release.py
      - run: python3 -m pip install 'cryptography==50.0.1'
      - run: python3 scripts/testing/test_revision_manifest.py
      - name: Validate current release notes
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          python3 scripts/publishing/validate-release.py --tag "v$version" --notes-file "$RUNNER_TEMP/release-notes.md"
  windows:
    name: Tests Windows (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked --features release-tools --bin release-tool
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo run --locked --features release-tools --bin release-tool -- check
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo clippy --locked --features release-tools --bin release-tool -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }} -- --test-threads=1
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }} --features service-updater --all-targets -- --test-threads=1
      - run: cargo clippy --locked --target ${{ matrix.target }} --features service-updater --all-targets -- -D warnings
      - name: Verify updater build configuration modes
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          CARGO_TARGET_DIR: target
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: python scripts/testing/test_updater_build.py
      - run: cargo build --release --locked --target ${{ matrix.target }}
        if: needs.changes.outputs.packages == 'true'
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.packages == 'true'
        with:
          name: windows-build-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/craft-apps-manager.exe
          if-no-files-found: error
          retention-days: 3

  windows-packages:
    name: Packages Windows (${{ matrix.arch }})
    needs: [changes, windows]
    if: needs.changes.outputs.packages == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-build-${{ matrix.target }}
          path: target/${{ matrix.target }}/release
      - name: Test Windows MSI upgrade and shortcuts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arch = if ('${{ matrix.target }}' -eq 'i686-pc-windows-msvc') { 'x86' } else { 'x64' }
          gh release download --repo ip7z/7zip --pattern '*-extra.7z' --dir 7zip-download
          & 'C:\Program Files\7-Zip\7z.exe' x (Get-ChildItem 7zip-download/*-extra.7z).FullName -o7zip -y
          if ($LASTEXITCODE -ne 0) { throw '7-Zip extraction failed' }
          $seven = if ($arch -eq 'x86') { '7zip' } else { '7zip/x64' }
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          $out = "dist/windows-$arch"
          ./scripts/packaging/package-windows.ps1 -Architecture $arch -SevenZipFolder $seven -TargetFolder target -OutputFolder $out
          $portableZip = (Get-ChildItem "$out/*.zip").FullName
          Expand-Archive -LiteralPath $portableZip -DestinationPath portable-check
          if (!(Test-Path 'portable-check/Craft Apps Manager/portable.txt')) { throw 'Portable marker missing' }
          if (!(Test-Path 'portable-check/Craft Apps Manager/CraftApps-Manager.exe')) { throw 'Portable executable missing' }
          ./scripts/packaging/package-windows-msi.ps1 -Architecture $arch -SevenZipFolder $seven -TargetFolder target -OutputFolder $out
          gh release download v0.5.1 --repo CryptoKey98/craft-apps-manager --pattern "Craft-Apps-Manager-0.5.1-windows-$arch.msi" --dir baseline
          $candidate = (Get-ChildItem "$out/*.msi").FullName
          ./scripts/testing/smoke-windows-msi.ps1 -Architecture $arch -BaselineMsi "baseline/Craft-Apps-Manager-0.5.1-windows-$arch.msi" -CandidateMsi $candidate
      - name: Install and remove real Craft apps
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/craft-apps-manager.exe"
          $library = Join-Path $env:RUNNER_TEMP 'craft-smoke'
          function Invoke-Manager([string[]]$Arguments) {
            $out = Join-Path $env:RUNNER_TEMP 'manager-output.txt'
            $p = Start-Process $exe -ArgumentList (@('--root', $library) + $Arguments) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
            Get-Content $out
            if ($p.ExitCode -ne 0) {
              Get-Content (Join-Path $library 'logs/updates.log') -ErrorAction SilentlyContinue | Select-Object -Last 40
              throw "Manager failed: $Arguments"
            }
          }
          Invoke-Manager @('--list-apps')
          foreach ($app in 'soundcraft', 'printcraft') {
            Invoke-Manager @('--release-format', 'portable', '--install-app', $app)
          }
          & (Join-Path $library 'releases/soundcraft/soundcraft-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'SoundCraft does not run' }
          & (Join-Path $library 'releases/printcraft/pdfcraft-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'PDFCraft does not run' }
          foreach ($app in 'soundcraft', 'printcraft') {
            Invoke-Manager @('--uninstall-app', $app)
            if (Test-Path (Join-Path $library "releases/$app")) { throw "$app was not removed" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages-${{ matrix.target }}
          path: |
            dist/windows-*/*.msi
            dist/windows-*/*.zip
          if-no-files-found: error
          retention-days: 3

  linux:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Tests Ubuntu 22.04 (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x64
            pkgconfig: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          - target: i686-unknown-linux-gnu
            arch: x86
            pkgconfig: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_LIBDIR: ${{ matrix.pkgconfig }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libssl-dev p7zip-full libarchive-tools
      - if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386 libx11-dev:i386 libxi-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 libxkbcommon-dev:i386 libwayland-dev:i386 libgl1-mesa-dev:i386 libegl1-mesa-dev:i386
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }} --all-targets -- --test-threads=1
        env:
          CRAFT_TEST_TOOLS: /tmp/craft-test-tools
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }} --features service-updater --all-targets -- --test-threads=1
      - run: cargo clippy --locked --target ${{ matrix.target }} --features service-updater --all-targets -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}
        if: needs.changes.outputs.packages == 'true'
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.packages == 'true'
        with:
          name: linux-build-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/craft-apps-manager
          if-no-files-found: error
          retention-days: 3

  linux-packages:
    name: Packages Linux (${{ matrix.arch }})
    needs: [changes, linux]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x64
          - target: i686-unknown-linux-gnu
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev rpm zip libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libssl-dev
      - if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libx11-dev:i386 libxi-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 libxkbcommon-dev:i386 libwayland-dev:i386 libgl1-mesa-dev:i386 libegl1-mesa-dev:i386
      - uses: actions/download-artifact@v4
        with:
          name: linux-build-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release
      - run: chmod +x target/${{ matrix.target }}/release/craft-apps-manager
      - name: Verify Linux portable ZIP and tar.gz packaging
        run: |
          sh scripts/packaging/package-linux-zip.sh target/${{ matrix.target }}/release/craft-apps-manager
          for archive in dist/linux/*.zip; do
            [ -f "$archive" ] || continue
            sh scripts/packaging/package-linux-tar.sh "$archive"
          done

      - name: Package native DEB and RPM
        run: |
          binary="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/craft-apps-manager"
          sh scripts/packaging/package-linux-deb.sh "$binary"
          sh scripts/packaging/package-linux-rpm.sh "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            dist/linux/*.zip
            dist/linux/*.tar.gz
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error
          retention-days: 3

  ubuntu-deb:
    name: Ubuntu 22.04 (x64 DEB)
    needs: [changes, linux-packages]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-x64
          path: packages
      - name: Install and verify DEB
        run: |
          sudo apt-get update
          sudo apt-get install -y ./packages/*.deb
          dpkg --verify craft-apps-manager
          test -f /usr/share/applications/craft-apps-manager.desktop
          test -f /usr/share/applications/craft-apps-builder.desktop
          craft-apps-manager --build-identity
      - name: Remove DEB and verify cleanup
        run: |
          sudo apt-get remove -y craft-apps-manager
          if dpkg-query -W -f='${db:Status-Status}' craft-apps-manager 2>/dev/null | grep -qx installed; then
            echo "Manager package is still installed" >&2
            exit 1
          fi
          test ! -e /usr/bin/craft-apps-manager
          test ! -e /usr/share/applications/craft-apps-manager.desktop
          test ! -e /usr/share/applications/craft-apps-builder.desktop

  debian:
    name: Debian 12 (x64 DEB)
    needs: [changes, linux-packages]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    container: debian:12-slim
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-x64
          path: packages
      - name: Install and verify Ubuntu-built DEB
        run: |
          apt-get update
          apt-get install -y ./packages/*.deb
          dpkg --verify craft-apps-manager
          test -f /usr/share/applications/craft-apps-manager.desktop
          test -f /usr/share/applications/craft-apps-builder.desktop
          craft-apps-manager --build-identity
      - name: Remove DEB and verify cleanup
        run: |
          apt-get remove -y craft-apps-manager
          if dpkg-query -W -f='${db:Status-Status}' craft-apps-manager 2>/dev/null | grep -qx installed; then
            echo "Manager package is still installed" >&2
            exit 1
          fi
          test ! -e /usr/bin/craft-apps-manager
          test ! -e /usr/share/applications/craft-apps-manager.desktop
          test ! -e /usr/share/applications/craft-apps-builder.desktop

  fedora:
    if: needs.changes.outputs.packages == 'true'
    name: Fedora 44 (x64 RPM)
    needs: [changes, linux-packages]
    runs-on: ubuntu-latest
    container: fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-x64
          path: packages
      - name: Install and verify Ubuntu-built RPM
        run: |
          dnf install -y ./packages/*.rpm
          rpm -q craft-apps-manager
          rpm -V craft-apps-manager
          test -f /usr/share/applications/craft-apps-manager.desktop
          test -f /usr/share/applications/craft-apps-builder.desktop
          craft-apps-manager --build-identity
      - name: Remove RPM and verify cleanup
        run: |
          dnf remove -y craft-apps-manager
          if rpm -q craft-apps-manager; then
            echo "Manager package is still installed" >&2
            exit 1
          fi
          test ! -e /usr/bin/craft-apps-manager
          test ! -e /usr/share/applications/craft-apps-manager.desktop
          test ! -e /usr/share/applications/craft-apps-builder.desktop

  archlinux:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    name: Arch Linux (x86_64)
    runs-on: ubuntu-latest
    container: archlinux:base
    defaults:
      run:
        shell: bash
    env:
      CRAFT_TEST_TOOLS: /tmp/craft-test-tools
      # Arch rustc recommends this stack size for ICU's release-mode const evaluation.
      RUST_MIN_STACK: "33554432"
    steps:
      - name: Install Arch build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust python pkgconf libxkbcommon wayland libx11 libxi libxrandr libxcursor libxinerama libglvnd openssl 7zip libarchive polkit libnotify xdg-utils
          useradd --create-home builder
      - uses: actions/checkout@v4
      - name: Prepare unprivileged build workspace
        run: chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Check formatting
        run: runuser -u builder -- cargo fmt --all -- --check
      - name: Test default updater
        run: runuser -u builder -- cargo test --locked --all-targets -- --test-threads=1
      - name: Test service updater
        run: runuser -u builder -- cargo test --locked --features service-updater --all-targets -- --test-threads=1
      - name: Clippy default updater
        run: runuser -u builder -- cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy service updater
        run: runuser -u builder -- cargo clippy --locked --all-targets --features service-updater -- -D warnings
      - name: Build and package for Arch
        run: |
          runuser -u builder -- cargo build --release --locked --bin craft-apps-manager
          runuser -u builder -- sh scripts/packaging/package-linux-arch.sh target/release/craft-apps-manager
      - name: Verify native package installation and removal
        run: |
          pacman -U --noconfirm dist/linux/*.pkg.tar.zst
          pacman -Q craft-apps-manager
          pacman -Qk craft-apps-manager
          pacman -R --noconfirm craft-apps-manager
      - uses: actions/upload-artifact@v4
        with:
          name: archlinux-x86_64
          path: dist/linux/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    name: Tests macOS
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo test --locked --all-targets -- --test-threads=1
      - run: cargo test --locked --features service-updater --all-targets -- --test-threads=1
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features service-updater -- -D warnings

  macos-packages:
    name: Packages macOS
    needs: [changes, macos]
    if: needs.changes.outputs.packages == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: ./scripts/packaging/package-macos.sh
        env:
          # Self-update from the releases of the repository being built.
          CRAFT_MANAGER_REPOSITORY: ${{ github.repository }}
      - name: Package the same verified bundle as DMG
        env:
          CRAFT_MANAGER_REPOSITORY: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          sh scripts/packaging/package-macos-dmg.sh 'dist/macos/Craft Apps Manager.app' "dist/macos/Craft-Apps-Manager-$version-macos-universal.dmg"
      - name: Verify DMG drag-to-Applications layout
        run: |
          python3 -m venv "$RUNNER_TEMP/craft-dmg-layout"
          "$RUNNER_TEMP/craft-dmg-layout/bin/python" -m pip install -r packaging/macos/dmg-requirements.txt
          "$RUNNER_TEMP/craft-dmg-layout/bin/python" scripts/testing/test_macos_dmg.py
      - name: Install and remove real Craft apps
        run: sh scripts/testing/smoke-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            dist/macos/*.zip
            dist/macos/*.dmg
          if-no-files-found: error

  production-catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.production_catalog_only == true
    permissions:
      contents: write
    uses: ./.github/workflows/renew-update-catalog.yml
    with:
      source_ref: ${{ github.sha }}
      mode: renew
      force_renew: true
    secrets: inherit

  gate:
    name: CI
    if: always()
    needs: [changes, documentation, format, updater-v2, release-metadata, windows, linux, macos, windows-packages, linux-packages, ubuntu-deb, debian, fedora, archlinux, macos-packages, production-catalog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require all selected checks to succeed
        run: python3 scripts/testing/ci_policy.py gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
