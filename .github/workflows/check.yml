name: Check
on:
  push:
    branches: [main]
    paths-ignore:
      - codemagic.yaml
  pull_request:
    paths-ignore:
      - codemagic.yaml
  workflow_dispatch:
    inputs:
      production_catalog_only:
        description: Test production catalog renewal only; never publish an application release
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Raises GitHub's API limit for the release lookups made by tests and end-to-end checks.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  updater-v2:
    if: github.event_name != 'workflow_dispatch' || inputs.production_catalog_only != true
    name: Signed updater routing and Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p craft-updater-config -p craft-updater-service -- --test-threads=1
      - run: python3 scripts/testing/test_updater_config.py
      - run: python3 scripts/testing/test_updater_review.py
      - run: python3 scripts/testing/test_script_entrypoints.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: update-service
      - run: npm test && npm run typecheck && npm run dry-run
        working-directory: update-service
      - run: python3 scripts/testing/test_update_catalog.py
      - run: python3 scripts/testing/test_immutable_assets.py
  release-metadata:
    if: github.event_name != 'workflow_dispatch' || inputs.production_catalog_only != true
    name: Release metadata and validation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/testing/test_validate_release.py
      - run: python3 -m pip install 'cryptography==50.0.1'
      - run: python3 scripts/testing/test_revision_manifest.py
      - name: Validate current release notes
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          python3 scripts/publishing/validate-release.py --tag "v$version" --notes-file "$RUNNER_TEMP/release-notes.md"
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.production_catalog_only != true
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: cargo fmt --check
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked --features release-tools --bin release-tool
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo run --locked --features release-tools --bin release-tool -- check
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo clippy --locked --features release-tools --bin release-tool -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }} -- --test-threads=1
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }} --features service-updater --all-targets -- --test-threads=1
      - run: cargo clippy --locked --target ${{ matrix.target }} --features service-updater --all-targets -- -D warnings
      - name: Verify updater build configuration modes
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          CARGO_TARGET_DIR: target
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: python scripts/testing/test_updater_build.py
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test Windows MSI upgrade and shortcuts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arch = if ('${{ matrix.target }}' -eq 'i686-pc-windows-msvc') { 'x86' } else { 'x64' }
          gh release download --repo ip7z/7zip --pattern '*-extra.7z' --dir 7zip-download
          & 'C:\Program Files\7-Zip\7z.exe' x (Get-ChildItem 7zip-download/*-extra.7z).FullName -o7zip -y
          if ($LASTEXITCODE -ne 0) { throw '7-Zip extraction failed' }
          $seven = if ($arch -eq 'x86') { '7zip' } else { '7zip/x64' }
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          $out = "dist/windows-$arch"
          ./scripts/packaging/package-windows-msi.ps1 -Architecture $arch -SevenZipFolder $seven -TargetFolder target -OutputFolder $out
          gh release download v0.5.1 --repo CryptoKey98/craft-apps-manager --pattern "Craft-Apps-Manager-0.5.1-windows-$arch.msi" --dir baseline
          $candidate = (Get-ChildItem "$out/*.msi").FullName
          ./scripts/testing/smoke-windows-msi.ps1 -Architecture $arch -BaselineMsi "baseline/Craft-Apps-Manager-0.5.1-windows-$arch.msi" -CandidateMsi $candidate
      - name: Install and remove real Craft apps
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/craft-apps-manager.exe"
          $library = Join-Path $env:RUNNER_TEMP 'craft-smoke'
          function Invoke-Manager([string[]]$Arguments) {
            $out = Join-Path $env:RUNNER_TEMP 'manager-output.txt'
            $p = Start-Process $exe -ArgumentList (@('--root', $library) + $Arguments) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
            Get-Content $out
            if ($p.ExitCode -ne 0) {
              Get-Content (Join-Path $library 'logs/updates.log') -ErrorAction SilentlyContinue | Select-Object -Last 40
              throw "Manager failed: $Arguments"
            }
          }
          Invoke-Manager @('--list-apps')
          foreach ($app in 'soundcraft', 'printcraft') {
            Invoke-Manager @('--release-format', 'portable', '--install-app', $app)
          }
          & (Join-Path $library 'releases/soundcraft/soundcraft-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'SoundCraft does not run' }
          & (Join-Path $library 'releases/printcraft/pdfcraft-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'PDFCraft does not run' }
          foreach ($app in 'soundcraft', 'printcraft') {
            Invoke-Manager @('--uninstall-app', $app)
            if (Test-Path (Join-Path $library "releases/$app")) { throw "$app was not removed" }
          }

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.production_catalog_only != true
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            pkgconfig: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          - target: i686-unknown-linux-gnu
            pkgconfig: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_LIBDIR: ${{ matrix.pkgconfig }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libssl-dev p7zip-full libarchive-tools
      - if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386 libx11-dev:i386 libxi-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 libxkbcommon-dev:i386 libwayland-dev:i386 libgl1-mesa-dev:i386 libegl1-mesa-dev:i386
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: cargo fmt --check
      - run: cargo test --locked --target ${{ matrix.target }} --all-targets -- --test-threads=1
        env:
          CRAFT_TEST_TOOLS: /tmp/craft-test-tools
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }} --features service-updater --all-targets -- --test-threads=1
      - run: cargo clippy --locked --target ${{ matrix.target }} --features service-updater --all-targets -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify Linux portable ZIP and tar.gz packaging
        run: |
          sh scripts/packaging/package-linux-zip.sh target/${{ matrix.target }}/release/craft-apps-manager
          for archive in dist/linux/*.zip; do
            [ -f "$archive" ] || continue
            sh scripts/packaging/package-linux-tar.sh "$archive"
          done

  archlinux:
    if: github.event_name != 'workflow_dispatch' || inputs.production_catalog_only != true
    name: Arch Linux (x86_64)
    runs-on: ubuntu-latest
    container: archlinux:base
    defaults:
      run:
        shell: bash
    env:
      CRAFT_TEST_TOOLS: /tmp/craft-test-tools
      # Arch rustc recommends this stack size for ICU's release-mode const evaluation.
      RUST_MIN_STACK: "33554432"
    steps:
      - name: Install Arch build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust python pkgconf libxkbcommon wayland libx11 libxi libxrandr libxcursor libxinerama libglvnd openssl 7zip libarchive polkit libnotify xdg-utils
          useradd --create-home builder
      - uses: actions/checkout@v4
      - name: Prepare unprivileged build workspace
        run: chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Formatting, tests and lint
        run: |
          runuser -u builder -- cargo fmt --all -- --check
          runuser -u builder -- cargo test --locked --all-targets -- --test-threads=1
          runuser -u builder -- cargo test --locked --features service-updater --all-targets -- --test-threads=1
          runuser -u builder -- cargo clippy --locked --all-targets -- -D warnings
          runuser -u builder -- cargo clippy --locked --all-targets --features service-updater -- -D warnings
      - name: Build and package for Arch
        run: |
          runuser -u builder -- cargo build --release --locked --bin craft-apps-manager
          runuser -u builder -- sh scripts/packaging/package-linux-arch.sh target/release/craft-apps-manager
      - name: Verify native package installation and removal
        run: |
          pacman -U --noconfirm dist/linux/*.pkg.tar.zst
          pacman -Q craft-apps-manager
          pacman -Qk craft-apps-manager
          pacman -R --noconfirm craft-apps-manager
      - uses: actions/upload-artifact@v4
        with:
          name: archlinux-x86_64
          path: dist/linux/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.production_catalog_only != true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo fmt --check
      - run: cargo test --locked --all-targets -- --test-threads=1
      - run: cargo test --locked --features service-updater --all-targets -- --test-threads=1
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features service-updater -- -D warnings
      - run: ./scripts/packaging/package-macos.sh
        env:
          # Self-update from the releases of the repository being built.
          CRAFT_MANAGER_REPOSITORY: ${{ github.repository }}
      - name: Package the same verified bundle as DMG
        env:
          CRAFT_MANAGER_REPOSITORY: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          sh scripts/packaging/package-macos-dmg.sh 'dist/macos/Craft Apps Manager.app' "dist/macos/Craft-Apps-Manager-$version-macos-universal.dmg"
      - name: Verify DMG drag-to-Applications layout
        run: |
          python3 -m venv "$RUNNER_TEMP/craft-dmg-layout"
          "$RUNNER_TEMP/craft-dmg-layout/bin/python" -m pip install -r packaging/macos/dmg-requirements.txt
          "$RUNNER_TEMP/craft-dmg-layout/bin/python" scripts/testing/test_macos_dmg.py
      - name: Install and remove real Craft apps
        run: sh scripts/testing/smoke-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            dist/macos/*.zip
            dist/macos/*.dmg
          if-no-files-found: error

  production-catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.production_catalog_only == true
    permissions:
      contents: write
    uses: ./.github/workflows/renew-update-catalog.yml
    with:
      source_ref: ${{ github.sha }}
      mode: renew
      force_renew: true
    secrets: inherit
